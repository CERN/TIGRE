name: Tests

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same PR cancels the run still going for the old push.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: Python ${{ matrix.python }} tests (CPU-only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest Python that pyproject.toml supports.
        python: ["3.11", "3.14"]
    # CUDA toolkit is needed to compile TIGRE. GitHub-hosted runners have no GPU,
    # so tests marked `gpu` are skipped automatically (see Python/tests/conftest.py).
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    env:
      MPLBACKEND: Agg
      # No GPU here, so compile for one architecture only (much faster).
      TIGRE_CUDA_ARCH: "75"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.10
          enable-cache: true
      - name: Build and install TIGRE
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install --python .venv/bin/python . pytest
      - name: Run tests
        run: .venv/bin/python -m pytest -ra
