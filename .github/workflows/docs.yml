name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "Frontispiece/**"
      - "Python/demos/**"
      - "MATLAB/Demos/**"
      - "CITATION.cff"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "Frontispiece/**"
      - "Python/demos/**"
      - "MATLAB/Demos/**"
      - "CITATION.cff"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt
      - name: Fetch the rendered gallery
        # Demo outputs are rendered on a GPU machine (docs/tools/build_gallery.py)
        # and kept on the docs-gallery branch; without it the gallery shows code only.
        run: |
          if git ls-remote --exit-code --heads origin docs-gallery > /dev/null; then
            git fetch --depth 1 origin docs-gallery
            mkdir -p docs/gallery
            git archive FETCH_HEAD | tar -x -C docs/gallery
          else
            echo "No docs-gallery branch yet"
          fi
      - name: Build HTML (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Check external links
        # Report-only: external sites go down for reasons outside our control.
        continue-on-error: true
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck
      - name: Upload site for preview
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
