name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-13 is an intel runner, macos-14 is apple silicon
        #os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-13, macos-14]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        # env:
        #   CIBW_SOME_OPTION: value
        #    ...
        # with:
        #   package-dir: .
        #   output-dir: wheelhouse
        #   config-file: "{package}/pyproject.toml"

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
  build_windows:
    # A quick check that TIGRE still builds on Windows: one Python version and
    # one GPU architecture. Releases build every version and architecture.
    name: Build a wheel on Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      # CUDA 12.8, as for the Linux wheels. Only the parts TIGRE builds with.
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "curand_dev", "thrust", "visual_studio_integration"]'
          use-github-cache: false
      # nvcc needs cl.exe on the PATH.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: cp313-win_amd64
          TIGRE_CUDA_ARCH: "75"
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-windows
          path: ./wheelhouse/*.whl
  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        version: 0.6.9
        enable-cache: true
    - name: Build SDist
      run: uv build --sdist
    - uses: actions/upload-artifact@v7
      with:
        name: cibw-sdist
        path: dist/*.tar.gz
