name: Build

# Building every wheel takes 15-20 minutes, so it does not run on every PR.
# The Tests workflow already compiles TIGRE on Linux for every PR, and the
# Windows Check workflow builds one Windows wheel for PRs that change compiled
# code. This workflow builds all wheels: weekly, by hand, and for PRs that
# change how TIGRE is packaged. Releases build their own (release.yml).
on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "setup.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "Python/MANIFEST.in"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"

# A new push to the same PR cancels the run still going for the old push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-13 is an intel runner, macos-14 is apple silicon
        #os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-13, macos-14]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        # env:
        #   CIBW_SOME_OPTION: value
        #    ...
        # with:
        #   package-dir: .
        #   output-dir: wheelhouse
        #   config-file: "{package}/pyproject.toml"

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
  build_windows:
    # A quick check that TIGRE still builds on Windows: one Python version and
    # one GPU architecture. Releases build every version and architecture.
    name: Build a wheel on Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      # CUDA 12.8, as for the Linux wheels. Only the parts TIGRE builds with.
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "curand_dev", "thrust", "visual_studio_integration"]'
          use-github-cache: false
      # nvcc needs cl.exe on the PATH.
      - uses: ilammy/msvc-dev-cmd@v1
      # cibuildwheel uses build[uv] (pyproject.toml), so it needs uv.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.10
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: cp313-win_amd64
          TIGRE_CUDA_ARCH: "75"
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-windows
          path: ./wheelhouse/*.whl
  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        version: 0.13.10
        enable-cache: true
    - name: Build SDist
      run: uv build --sdist
    - uses: actions/upload-artifact@v7
      with:
        name: cibw-sdist
        path: dist/*.tar.gz
