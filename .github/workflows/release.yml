name: Release

on:
  push:
    tags:
      # Run on any tag starting with a `v`, e.g. v1.2.3
      - v*

jobs:
  check_version:
    name: Check tag matches pyproject version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag and pyproject version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version v${VERSION}. Bump the version in pyproject.toml before tagging."
            exit 1
          fi

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: check_version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-13 is an intel runner, macos-14 is apple silicon
        #os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-13, macos-14]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_windows:
    name: Build wheels on Windows
    needs: check_version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      # CUDA 12.8, as for the Linux wheels. Only the parts TIGRE builds with.
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "curand_dev", "thrust", "visual_studio_integration"]'
          use-github-cache: false
      # nvcc needs cl.exe on the PATH.
      - uses: ilammy/msvc-dev-cmd@v1
      # cibuildwheel uses build[uv] (pyproject.toml), so it needs uv.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.10
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-windows
          path: ./wheelhouse/*.whl

  make_sdist:
    name: Make SDist
    needs: check_version
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.6.9
          enable-cache: true
      - name: Build SDist
        run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # TIGRE is not published to PyPI: the `tigre` name there belongs to an
  # unrelated project. Wheels and the sdist are attached to the GitHub Release.
  github_release:
    name: Attach wheels to GitHub Release
    needs: [build_wheels, build_windows, make_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Create or update the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
