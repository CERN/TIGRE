[tool.black]
line-length = 100

[build-system]
requires = [
	"setuptools",
	"wheel",
	"Cython",
	"numpy<2.5.1",
	]
build-backend = "setuptools.build_meta"

[project]
name="tigre"
version="3.2.0"
dependencies = [
	"matplotlib",
	"numpy>=1.20.0",
	"scipy",
	"h5py",
	"tqdm"
]
authors=[
	{name = "Ander Biguri"},
	{name = "Reuben Lindroos"},
	{name = "Sam Loescher"},
]
license={text="BSD-3-Clause"}
requires-python = ">=3.11,<3.15"

[dependency-groups]
dev = [
	"black~=26.3",
	"flake8~=3.8",
	"flake8-annotations~=2.5",
	"flake8-bugbear~=20.11",
	"flake8-docstrings~=1.5",
	"flake8-import-order~=0.18",
	"pep8-naming~=0.11",
	"pre-commit~=2.10",
]

[tool.pytest.ini_options]
testpaths = ["Python/tests"]
markers = [
	"gpu: test needs a CUDA-capable GPU (skipped automatically when none is available)",
]

[tool.setuptools.packages.find]
where = ["Python"]

[tool.setuptools.package-data]
"tigre.utilities.cuda_interface" = ["*.pyx", "*.pxd", "*.cpp"]

[tool.cibuildwheel]
build-frontend = "build[uv]"
# Skip PyPy, musl and the free-threaded CPython builds (cp314t...), which TIGRE's
# Cython extensions have not been checked against.
skip = "pp* *musl* cp3??t-*"
archs = ["native"]

[tool.cibuildwheel.linux]
# CUDA installation. cibuildwheel >= 3 builds in manylinux_2_28 (AlmaLinux 8),
# so this uses NVIDIA's RHEL 8 repository.
before-all = """
curl -fsSL -o /etc/yum.repos.d/cuda-rhel8.repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo &&
dnf clean all &&
dnf -y install cuda-nvcc-12-4 cuda-cudart-devel-12-4 libcurand-devel-12-4 &&
ls -al /usr/local &&
export PATH=$PATH:/usr/local/cuda/bin &&
export CUDA_PATH=/usr/local/cuda &&
nvcc --version &&
export BUILD_WITH_CUDA=1
"""
