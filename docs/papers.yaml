# Published work that USES TIGRE (not only cites it).
#
# This file generates docs/papers.md. To add a paper, append an entry and open
# a pull request. Fields:
#   title, authors (list, "Given Family"), venue, year (required)
#   doi or url (one of them, recommended)
#   area: one of the area keys in docs/_ext/tigre_papers.py
#   note: optional, one line on how TIGRE was used
# Papers about TIGRE itself are listed on the Citing page, not here.

- title: Validation and application of a new image reconstruction software toolbox (TIGRE) for breast cone-beam computed tomography
